name: Verify portfolio
on:
  pull_request:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-latest
    env:
      TEST_BASE_PATH: /my-portofolio
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npm run check
      - run: npm run build
      - run: npm test
      - run: npx playwright install --with-deps chromium
      - name: Browser accessibility and responsive stories
        run: |
          export CHROMIUM_PATH="$(node --input-type=module -e "import {chromium} from '@playwright/test'; console.log(chromium.executablePath())")"
          npm run test:browser
      - run: npm audit --audit-level=moderate
